<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#040D18" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.4" />

  <!-- Industrial Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8" />

  <!-- Capacitor Schematic / Monogram Icon Symbol -->
  <!-- Left Lead -->
  <path d="M 120 256 L 216 256" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" />
  <!-- Left Capacitor Plate -->
  <rect x="216" y="146" width="22" height="220" rx="6" fill="url(#plateGrad)" />

  <!-- Right Capacitor Plate (Curved or Polarized Gap) -->
  <rect x="274" y="146" width="22" height="220" rx="6" fill="url(#plateGrad)" />
  <!-- Right Lead -->
  <path d="M 296 256 L 392 256" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- High-Tech Central Spark / Dielectric Core Dot -->
  <circle cx="256" cy="256" r="6" fill="#38BDF8" />

  <!-- "N" Technical Overlay Symbol -->
  <path d="M 238 310 L 238 202 L 274 310 L 274 202" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Subtle Voltage Polarity Indicator -->
  <path d="M 160 216 L 160 236 M 150 226 L 170 226" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 342 226 L 362 226" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Brand Typography Stamp -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="8" fill="#F8FAFC" text-anchor="middle">NEUTRACAP</text>
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#38BDF8" text-anchor="middle">INDUSTRIAL CAPACITORS</text>
</svg>
